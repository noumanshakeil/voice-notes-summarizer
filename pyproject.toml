[project]
name = "voice-notes-summarizer"
version = "2.0.0"
description = "Voice note jobs with transcript, LLM summary, and action items — mock audio ingest for offline demos."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
